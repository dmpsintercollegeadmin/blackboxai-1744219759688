<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Attendance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex">
    <!-- Sidebar -->
    <div class="w-64 bg-blue-800 text-white p-4">
      <h1 class="text-2xl font-bold mb-8">School Portal</h1>
      <nav>
        <ul class="space-y-2">
          <li>
            <a href="#" class="flex items-center p-2 rounded hover:bg-blue-700">
              <i class="fas fa-home mr-2"></i> Dashboard
            </a>
          </li>
          <li>
            <a href="#attendance" class="flex items-center p-2 rounded bg-blue-700">
              <i class="fas fa-calendar-check mr-2"></i> Attendance
            </a>
          </li>
          <li>
            <a href="#classes" class="flex items-center p-2 rounded hover:bg-blue-700">
              <i class="fas fa-chalkboard-teacher mr-2"></i> My Classes
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8">
      <header class="mb-8">
        <h2 class="text-3xl font-bold text-gray-800">Attendance Management</h2>
      </header>

      <!-- Self Attendance -->
      <section class="bg-white rounded-lg shadow p-6 mb-8">
        <h3 class="text-xl font-semibold mb-4">Mark Your Attendance</h3>
        <div class="flex items-center space-x-4">
          <button id="mark-present" class="bg-green-500 text-white px-4 py-2 rounded-lg hover:bg-green-600">
            <i class="fas fa-check-circle mr-2"></i> Present Today
          </button>
          <div id="attendance-status" class="text-gray-600">
            <!-- Status will be shown here -->
          </div>
        </div>
      </section>

      <!-- Class Attendance -->
      <section id="class-attendance" class="bg-white rounded-lg shadow p-6">
        <div class="flex justify-between items-center mb-4">
          <h3 class="text-xl font-semibold">Class Attendance</h3>
          <div class="flex items-center space-x-2">
            <input type="date" id="attendance-date" class="border rounded-lg p-2">
            <select id="class-select" class="border rounded-lg p-2">
              <!-- Classes will be loaded here -->
            </select>
          </div>
        </div>
        
        <div class="overflow-x-auto">
          <table class="min-w-full">
            <thead>
              <tr class="bg-gray-100">
                <th class="p-3 text-left">Student</th>
                <th class="p-3 text-left">Status</th>
                <th class="p-3 text-left">Notes</th>
              </tr>
            </thead>
            <tbody id="student-attendance-list">
              <!-- Attendance data will be loaded here -->
            </tbody>
          </table>
        </div>

        <div class="mt-4 flex justify-end">
          <button id="save-attendance" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">
            <i class="fas fa-save mr-2"></i> Save Attendance
          </button>
        </div>
      </section>
    </div>
  </div>

  <script src="/js/teacher-attendance.js"></script>
</body>
</html>
