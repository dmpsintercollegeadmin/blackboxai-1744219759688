<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teacher Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">
  <div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold">Teacher Management</h1>
      <a href="/" class="text-blue-500 hover:text-blue-700">
        <i class="fas fa-home mr-2"></i>Back to Dashboard
      </a>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md mb-8">
      <h2 class="text-xl font-semibold mb-4">Add New Teacher</h2>
      <form id="teacherForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 mb-2">First Name</label>
          <input type="text" name="firstName" class="w-full p-2 border rounded" required>
        </div>
        <div>
          <label class="block text-gray-700 mb-2">Last Name</label>
          <input type="text" name="lastName" class="w-full p-2 border rounded" required>
        </div>
        <div>
          <label class="block text-gray-700 mb-2">Email</label>
          <input type="email" name="email" class="w-full p-2 border rounded" required>
        </div>
        <div>
          <label class="block text-gray-700 mb-2">Phone</label>
          <input type="tel" name="phone" class="w-full p-2 border rounded" required>
        </div>
        <div class="md:col-span-2">
          <label class="block text-gray-700 mb-2">Address</label>
          <textarea name="address" class="w-full p-2 border rounded" required></textarea>
        </div>
        <div>
          <label class="block text-gray-700 mb-2">Qualification</label>
          <input type="text" name="qualification" class="w-full p-2 border rounded" required>
        </div>
        <div>
          <label class="block text-gray-700 mb-2">Subjects (comma separated)</label>
          <input type="text" name="subjects" class="w-full p-2 border rounded" required>
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
            Add Teacher
          </button>
        </div>
      </form>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4">Teacher List</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full bg-white" id="teachersTable">
          <thead>
            <tr>
              <th class="py-2 px-4 border-b">Name</th>
              <th class="py-2 px-4 border-b">Email</th>
              <th class="py-2 px-4 border-b">Qualification</th>
              <th class="py-2 px-4 border-b">Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Teacher data will be loaded here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/teachers.js"></script>
</body>
</html>
