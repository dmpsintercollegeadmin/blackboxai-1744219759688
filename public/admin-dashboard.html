<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex">
    <!-- Sidebar -->
    <div class="w-64 bg-indigo-800 text-white p-4">
      <h1 class="text-2xl font-bold mb-8">Admin Portal</h1>
      <nav>
        <ul class="space-y-2">
          <li>
            <a href="#" class="flex items-center p-2 rounded bg-indigo-700">
              <i class="fas fa-tachometer-alt mr-2"></i> Dashboard
            </a>
          </li>
          <li>
            <a href="#users" class="flex items-center p-2 rounded hover:bg-indigo-700">
              <i class="fas fa-users mr-2"></i> User Management
            </a>
          </li>
          <li>
            <a href="#attendance" class="flex items-center p-2 rounded hover:bg-indigo-700">
              <i class="fas fa-calendar-check mr-2"></i> Attendance Reports
            </a>
          </li>
          <li>
            <a href="#classes" class="flex items-center p-2 rounded hover:bg-indigo-700">
              <i class="fas fa-chalkboard mr-2"></i> Class Management
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8">
      <header class="mb-8">
        <h2 class="text-3xl font-bold text-gray-800">Admin Dashboard</h2>
      </header>

      <!-- Stats Cards -->
      <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-white rounded-lg shadow p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-500">Total Students</p>
              <h3 id="total-students" class="text-2xl font-bold">0</h3>
            </div>
            <div class="bg-blue-100 p-3 rounded-full">
              <i class="fas fa-user-graduate text-blue-600"></i>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-500">Total Teachers</p>
              <h3 id="total-teachers" class="text-2xl font-bold">0</h3>
            </div>
            <div class="bg-green-100 p-3 rounded-full">
              <i class="fas fa-chalkboard-teacher text-green-600"></i>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-500">Today's Attendance</p>
              <h3 id="today-attendance" class="text-2xl font-bold">0%</h3>
            </div>
            <div class="bg-yellow-100 p-3 rounded-full">
              <i class="fas fa-calendar-day text-yellow-600"></i>
            </div>
          </div>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-gray-500">Active Classes</p>
              <h3 id="active-classes" class="text-2xl font-bold">0</h3>
            </div>
            <div class="bg-purple-100 p-3 rounded-full">
              <i class="fas fa-school text-purple-600"></i>
            </div>
          </div>
        </div>
      </div>

      <!-- Charts -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8">
        <div class="bg-white rounded-lg shadow p-6">
          <h3 class="text-xl font-semibold mb-4">Attendance Trend</h3>
          <canvas id="attendanceChart" height="300"></canvas>
        </div>
        <div class="bg-white rounded-lg shadow p-6">
          <h3 class="text-xl font-semibold mb-4">Class Distribution</h3>
          <canvas id="classChart" height="300"></canvas>
        </div>
      </div>

      <!-- Recent Activity -->
      <div class="bg-white rounded-lg shadow p-6">
        <h3 class="text-xl font-semibold mb-4">Recent Activity</h3>
        <div id="recent-activity" class="space-y-4">
          <!-- Activity items will be loaded here -->
        </div>
      </div>
    </div>
  </div>

  <script src="/js/admin-dashboard.js"></script>
</body>
</html>
