<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parent Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex">
    <!-- Sidebar -->
    <div class="w-64 bg-blue-800 text-white p-4">
      <h1 class="text-2xl font-bold mb-8">School Portal</h1>
      <nav>
        <ul class="space-y-2">
          <li>
            <a href="#" class="flex items-center p-2 rounded hover:bg-blue-700">
              <i class="fas fa-home mr-2"></i> Dashboard
            </a>
          </li>
          <li>
            <a href="#attendance" class="flex items-center p-2 rounded hover:bg-blue-700">
              <i class="fas fa-calendar-check mr-2"></i> Attendance
            </a>
          </li>
          <li>
            <a href="#fees" class="flex items-center p-2 rounded hover:bg-blue-700">
              <i class="fas fa-money-bill-wave mr-2"></i> Fee Details
            </a>
          </li>
          <li>
            <a href="#messages" class="flex items-center p-2 rounded hover:bg-blue-700">
              <i class="fas fa-envelope mr-2"></i> Messages
            </a>
          </li>
        </ul>
      </nav>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8">
      <header class="mb-8">
        <h2 class="text-3xl font-bold text-gray-800">Parent Dashboard</h2>
      </header>

      <!-- Child Info -->
      <section class="bg-white rounded-lg shadow p-6 mb-8">
        <h3 class="text-xl font-semibold mb-4">My Child</h3>
        <div id="child-info" class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <!-- Child data will be loaded here -->
        </div>
      </section>

      <!-- Attendance -->
      <section id="attendance" class="bg-white rounded-lg shadow p-6 mb-8">
        <h3 class="text-xl font-semibold mb-4">Attendance</h3>
        <div class="overflow-x-auto">
          <table class="min-w-full">
            <thead>
              <tr class="bg-gray-100">
                <th class="p-3 text-left">Date</th>
                <th class="p-3 text-left">Class</th>
                <th class="p-3 text-left">Status</th>
              </tr>
            </thead>
            <tbody id="attendance-list">
              <!-- Attendance data will be loaded here -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- Fee Details -->
      <section id="fees" class="bg-white rounded-lg shadow p-6">
        <h3 class="text-xl font-semibold mb-4">Fee Details</h3>
        <div id="fee-details">
          <!-- Fee data will be loaded here -->
        </div>
      </section>
    </div>
  </div>

  <script src="/js/parent.js"></script>
</body>
</html>
