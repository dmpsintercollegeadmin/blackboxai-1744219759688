<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Class Management</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="bg-gray-100">
  <div class="container mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold">Class Management</h1>
      <a href="/" class="text-blue-500 hover:text-blue-700">
        <i class="fas fa-home mr-2"></i>Back to Dashboard
      </a>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md mb-8">
      <h2 class="text-xl font-semibold mb-4">Add New Class</h2>
      <form id="classForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-gray-700 mb-2">Class Name</label>
          <input type="text" name="className" class="w-full p-2 border rounded" required>
        </div>
        <div>
          <label class="block text-gray-700 mb-2">Grade Level</label>
          <input type="number" name="gradeLevel" class="w-full p-2 border rounded" required>
        </div>
        <div>
          <label class="block text-gray-700 mb-2">Room Number</label>
          <input type="text" name="roomNumber" class="w-full p-2 border rounded">
        </div>
        <div>
          <label class="block text-gray-700 mb-2">Capacity</label>
          <input type="number" name="capacity" class="w-full p-2 border rounded">
        </div>
        <div>
          <label class="block text-gray-700 mb-2">Meeting Days</label>
          <input type="text" name="days" class="w-full p-2 border rounded" placeholder="e.g. Mon,Wed,Fri">
        </div>
        <div>
          <label class="block text-gray-700 mb-2">Meeting Time</label>
          <input type="text" name="time" class="w-full p-2 border rounded" placeholder="e.g. 9:00-10:30">
        </div>
        <div class="md:col-span-2">
          <button type="submit" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
            Add Class
          </button>
        </div>
      </form>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-md">
      <h2 class="text-xl font-semibold mb-4">Class List</h2>
      <div class="overflow-x-auto">
        <table class="min-w-full bg-white" id="classesTable">
          <thead>
            <tr>
              <th class="py-2 px-4 border-b">Class Name</th>
              <th class="py-2 px-4 border-b">Grade Level</th>
              <th class="py-2 px-4 border-b">Room</th>
              <th class="py-2 px-4 border-b">Schedule</th>
              <th class="py-2 px-4 border-b">Actions</th>
            </tr>
          </thead>
          <tbody>
            <!-- Class data will be loaded here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script src="/js/classes.js"></script>
</body>
</html>
